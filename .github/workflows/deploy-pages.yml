name: Verify and deploy Flutter catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test packages and catalog
        run: >-
          flutter test
          packages/jelly_ui/test
          packages/jelly_ui/benchmark
          packages/jelly_morph_neobrutalism/test
          apps/catalog/test

      - name: Build release catalog
        working-directory: apps/catalog
        run: flutter build web --release --base-href /

      - name: Include custom domain
        run: cp CNAME apps/catalog/build/web/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload catalog
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/catalog/build/web

      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@v4
